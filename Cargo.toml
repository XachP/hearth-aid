[workspace]

[package]
name = "hearth_aid"
version = "0.1.0"
edition = "2024"
description = "Hearth: dignified, confidential cash aid on Tari Ootle. Donors see a provable public total, an auditor reconciles every grant with a view key, and nobody can read what any family received."
license = "MIT"

[package.metadata.tari-template]
tags = ["humanitarian", "cash-aid", "privacy", "confidential", "view-key", "audit", "social-good"]
category = "public-goods"

[dependencies]
tari_template_lib = { version = "0.35" }

[dev-dependencies]
tari_template_test_tooling = "0.47"
rand = "0.10"
serde_json = "1"
tari_crypto = "=0.24.0"

[build-dependencies]
tari_ootle_template_build = "0.16"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
